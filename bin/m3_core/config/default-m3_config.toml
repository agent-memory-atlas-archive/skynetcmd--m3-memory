# speaker_in_title = true

# Multiplier for a superseded memory's score (1.0 = no penalty).
# env (not read): M3_SUPERSEDES_PENALTY, SUPERSEDES_PENALTY
# type: number; restart to apply
# supersedes_penalty = 0.5

# Score added when the query matches the title.
# env (not read): M3_TITLE_MATCH_BOOST, TITLE_MATCH_BOOST
# type: number; restart to apply
# title_match_boost = 0.15

# Supporting turns kept per observation.
# env (not read): M3_TWO_STAGE_MAX_TURNS_PER_OBS
# type: integer; restart to apply
# two_stage_max_turns_per_observation = 3

# Expand observation hits to their source turns (also on automatically once 100
# observations exist).
# env (not read): M3_TWO_STAGE_OBSERVATIONS
# type: boolean; restart to apply
# two_stage_observations = false

# Multiplier for raw turns in a two-stage search.
# env (not read): M3_TWO_STAGE_TURN_PENALTY
# type: number; restart to apply
# two_stage_turn_penalty = 0.7

[secrets]

# The user-only secrets file: every m3 secret, as its value or a pointer to its OS
# keyring entry. Default: <config root>/m3_secrets.toml.
# type: path; restart to apply
# file = <config root>/m3_secrets.toml  # default (computed)

[services]

# Address the macbook status server binds.
# env (not read): M3_MACBOOK_STATUS_HOST, MACBOOK_STATUS_HOST
# type: string; restart to apply
# macbook_status_host = "127.0.0.1"

[slm]

# Use the SLM to classify search intent.
# env (not read): M3_SLM_CLASSIFIER
# type: boolean; restart to apply
# classifier = false

# Default SLM profile for intent classification.
# env (not read): M3_SLM_PROFILE
# type: string; restart to apply
# profile = "default"

# Extra directories searched first for SLM profiles (os.pathsep-separated in env).
# env (not read): M3_SLM_PROFILES_DIR
# type: string; restart to apply
# profile_dirs = []

[sync]

# Warehouse address (legacy form).
# env (not read): M3_SYNC_TARGET_IP, SYNC_TARGET_IP
# type: string; restart to apply
# target_ip = <unset>  # default (computed)

# Seconds one warehouse sync may take.
# env (not read): M3_PG_SYNC_TIMEOUT
# type: integer; restart to apply
# timeout_s = 600

# Warehouse host. Default: sync.target_ip, then the warehouse DSN's host.
# env (not read): M3_POSTGRES_SERVER, POSTGRES_SERVER
# type: string; restart to apply
# warehouse_host = <sync.target_ip, then the warehouse DSN's host>  # default (computed)

[tools]

# Load MCP tool domains on demand.
# env (not read): M3_TOOLS_LAZY
# type: boolean; restart to apply
# lazy = true

# MCP tools registered at session start (must include the escape hatch). Unset:
# .tools_config.json startup_tools, else the shipped set.
# env (not read): M3_TOOLS_STARTUP
# type: list of strings; restart to apply
# startup = <unset: .tools_config.json startup_tools, else the shipped set>  # default (computed)

# Seconds a tool call may take; 0 or less disables. Unset: each tool's own, else 30.
# env (not read): M3_TOOL_TIMEOUT
# type: number; restart to apply
# timeout_s = <unset: each tool's own, else 30>  # default (computed)

[wiki.compile]

# Prose-compile model. Default: wiki.synth.model.
# env (not read): M3_WIKI_COMPILE_MODEL
# type: string; restart to apply
# model = <wiki.synth.model>  # default (computed)

# Seconds a compile call may take.
# env (not read): M3_WIKI_COMPILE_TIMEOUT
# type: number; restart to apply
# timeout_s = 60.0

# Prose-compile URL. Default: wiki.synth.url.
# env (not read): M3_WIKI_COMPILE_URL
# type: string; restart to apply
# url = <wiki.synth.url>  # default (computed)

[wiki.drift]

# Judge model. Default: wiki.synth.model.
# env (not read): M3_WIKI_DRIFT_MODEL
# type: string; restart to apply
# model = <wiki.synth.model>  # default (computed)

# Seconds a judge call may take.
# env (not read): M3_WIKI_DRIFT_TIMEOUT
# type: number; restart to apply
# timeout_s = 30.0

# Citation-drift and derivability judge URL. Default: wiki.synth.url.
# env (not read): M3_WIKI_DRIFT_URL
# type: string; restart to apply
# url = <wiki.synth.url>  # default (computed)

[wiki.synth]

# Synthesis model; unset uses the server's.
# env (not read): M3_WIKI_SYNTH_MODEL
# type: string; restart to apply
# model = <unset: uses the server's>  # default (computed)

# Seconds a synthesis call may take.
# env (not read): M3_WIKI_SYNTH_TIMEOUT
# type: number; restart to apply
# timeout_s = 30.0

# Chat-completions URL for wiki synthesis.
# env (not read): M3_WIKI_SYNTH_URL
# type: string; restart to apply
# url = "http://127.0.0.1:1234/v1/chat/completions"
