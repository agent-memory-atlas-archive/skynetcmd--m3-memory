# m3 configuration: m3_config.toml

# GENERATED from m3's config registry by bin/gen_config_docs.py. m3 copies it
# into the config root once, when no m3_config.toml exists there, and never
# rewrites a file that exists. Every key: docs/CONFIG_REFERENCE.md.
#
# Every setting is listed at its default, COMMENTED OUT. A commented setting
# follows m3's built-in default, so a later release that changes a default still
# reaches you, and the values you set stand out. To set one, remove its leading
# "# " and change the value, or run `m3 config set KEY VALUE`, which does the
# same in place; `m3 config unset KEY` comments it out again.
# `m3 config show --origin` prints every setting and where its value came from.
#
# A value written <like this> has no fixed default: m3 works it out when it runs
# (from a root, the host or another setting). Replace all of it, brackets too,
# if you set one; left as is, the line is not valid TOML and m3 says so.
#
# "env (not read)" lists the environment names a setting answered to before
# this file. m3 does not read them; `m3 doctor` names any still set, to delete.
# When there is no m3_config.toml yet, `m3 setup` / `m3 upgrade` copy their
# values here once; `m3 config import-env` does it on request.
#
# Paths: "~" is your home folder on every OS. Use forward slashes, which work
# on Windows too ("~/m3/engine", "C:/m3/engine"). In double quotes a backslash
# starts an escape, so write a path with backslashes in single quotes:
# 'C:\m3\engine'.
#
# Secrets (API keys, DSNs, tokens) never go in this file: m3 refuses one here.
# They live in the user-only secrets file that [secrets] file names (default
# <config root>/m3_secrets.toml); store one with `m3 secret set NAME`.

schema_version = 1

[audit]

# Record who read which memory, and when (memory_access_log).
# env (not read): M3_AUDIT_READ_LOG
# type: boolean; restart to apply
# read_log = true

# Days the read-access log keeps a row before maintenance prunes it.
# env (not read): M3_AUDIT_READ_LOG_RETENTION_DAYS
# type: integer; restart to apply
# read_log_retention_days = 90

[autonomy]

# Let the loop prune the chatlog without review.
# env (not read): M3_CHATLOG_PRUNE_AUTO
# type: boolean; restart to apply
# chatlog_prune_auto = false

# Let the loop apply belief consolidation without review.
# env (not read): M3_CONSOLIDATION_AUTO
# type: boolean; restart to apply
# consolidation_auto = false

# Let the loop apply distilled procedures without review.
# env (not read): M3_DISTILL_AUTO
# type: boolean; restart to apply
# distill_auto = false

[chatlog]

# Queue an observation after an ingest of chatlog.auto_enrich_min_turns or more turns.
# env (not read): M3_AUTO_ENRICH
# type: boolean; restart to apply
# auto_enrich = false

# Turns an ingest needs before chatlog.auto_enrich queues an observation.
# env (not read): M3_AUTO_ENRICH_MIN_TURNS
# type: integer; restart to apply
# auto_enrich_min_turns = 10

# Show the chatlog status line.
# env (not read): M3_CHATLOG_STATUSLINE, CHATLOG_STATUSLINE
# type: boolean; restart to apply
# statusline = true

# Use [!] instead of the warning sign in the status line.
# env (not read): M3_CHATLOG_STATUSLINE_ASCII, CHATLOG_STATUSLINE_ASCII
# type: boolean; restart to apply
# statusline_ascii = false

[chatlog.db]

# SQLite connections in the chatlog pool.
# env (not read): M3_CHATLOG_DB_POOL_SIZE, CHATLOG_DB_POOL_SIZE
# type: integer; restart to apply
# pool_size = 4

# Seconds: the chatlog's SQLite busy timeout AND its pool checkout wait (one value, two
# uses today).
# env (not read): M3_CHATLOG_DB_POOL_TIMEOUT, CHATLOG_DB_POOL_TIMEOUT
# type: integer; restart to apply
# pool_timeout_s = 10

[chatlog.embed]

# Seconds one sweeper run may take; 0 or less is unbounded.
# env (not read): M3_CHATLOG_EMBED_DEADLINE_S, CHATLOG_EMBED_DEADLINE_S
# type: number; restart to apply
# deadline_s = 60.0

# Rows one sweeper run embeds.
# env (not read): M3_CHATLOG_EMBED_MAX_PER_RUN, CHATLOG_EMBED_MAX_PER_RUN
# type: integer; restart to apply
# max_per_run = 10000

[chatlog.spill]

# Attempts to drain a spilled chatlog batch (today .spill_config.json wins).
# env (not read): M3_SPILL_MAX_ATTEMPTS
# type: integer; restart to apply
# max_drain_attempts = 5

[cloud]

# Allow embedding through the cloud enclave when local tiers fail (privacy gate).
# env (not read): M3_ALLOW_CLOUD_FALLBACK
# type: boolean; restart to apply
# allow_fallback = false

# Keyring entry holding the enclave token, as service:user or user (service m3_memory).
# A REFERENCE, not the secret; the secret is M3_CLOUD_AUTH_TOKEN.
# env (not read): M3_CLOUD_AUTH_TOKEN_KEYRING
# type: string; restart to apply
# auth_token_keyring = <unset>  # default (computed)

# The cloud enclave's URL.
# env (not read): M3_CLOUD_ENCLAVE_URL
# type: string; restart to apply
# enclave_url = <unset>  # default (computed)

[context]

# M3Context instances kept per process.
# env (not read): M3_CONTEXT_CACHE_SIZE
# type: integer; restart to apply
# cache_size = 16

[crypto]

# Crypto backend: DEFAULT or WOLFSSL (forced by crypto.fips_mode / fips_strict). (Today
# an unknown value acts as DEFAULT; it is now an error.)
# env (not read): M3_CRYPTO_BACKEND
# type: string; one of DEFAULT, WOLFSSL; restart to apply
# backend = "DEFAULT"

# FIPS 140-3 mode: wolfSSL/wolfCrypt is required and any failure is fatal.
# env (not read): M3_FIPS_MODE
# type: boolean; restart to apply
# fips_mode = false

# Also require the CMVP-validated wolfCrypt build (implies the wolfSSL backend).
# env (not read): M3_FIPS_STRICT
# type: boolean; restart to apply
# fips_strict = false

# Under crypto.fips_strict, attest that network TLS (Python's ssl and PostgreSQL's
# libpq) runs on a FIPS 140-3 validated library, e.g. an OS FIPS OpenSSL provider. m3
# cannot verify this itself; without it, strict mode refuses network TLS. See
# docs/FIPS_MODULE_BOUNDARY.md.
# type: boolean; restart to apply
# tls_validated = false

# The wolfSSL library file tried first; unset searches the trusted lib dirs.
# env (not read): M3_WOLFSSL_LIB
# type: path; restart to apply
# wolfssl_lib = <unset: searches the trusted lib dirs>  # default (computed)

# Integrity pin for the wolfSSL library; checked when wolfSSL initialises.
# env (not read): M3_WOLFSSL_SHA256
# type: string; restart to apply
# wolfssl_sha256 = <unset>  # default (computed)

[dashboard]

# Address the dashboard binds.
# env (not read): M3_DASHBOARD_HOST
# type: string; restart to apply
# host = "127.0.0.1"

# Seconds an endpoint that failed the smoke test is skipped.
# env (not read): M3_DASHBOARD_LLM_BLOCK_TTL_S
# type: number; restart to apply
# llm_block_ttl_s = 45.0

# Let the dashboard send a small test prompt to each LLM endpoint.
# env (not read): M3_DASHBOARD_LLM_SMOKE
# type: boolean; restart to apply
# llm_smoke = false

# Seconds an LLM smoke result is cached.
# env (not read): M3_DASHBOARD_LLM_SMOKE_TTL_S
# type: number; restart to apply
# llm_smoke_ttl_s = 900.0

# Dashboard port.
# env (not read): M3_DASHBOARD_PORT
# type: integer; restart to apply
# port = 8088

[db]

# Primary storage backend. Set it with `m3 config set db.backend postgres`; the former
# names M3_DB_BACKEND and DB_BACKEND are not read.
# env (not read): M3_DB_BACKEND, DB_BACKEND
# type: string; one of sqlite, postgres; restart to apply
# backend = "sqlite"

# SQLite connections in M3Context's pool.
# env (not read): M3_DB_POOL_SIZE, DB_POOL_SIZE
# type: integer; restart to apply
# pool_size = 5

# Seconds to wait for a pooled SQLite connection.
# env (not read): M3_DB_POOL_TIMEOUT, DB_POOL_TIMEOUT
# type: integer; restart to apply
# pool_timeout_s = 30

# SQLite mmap_size in bytes; unset keeps the pragma profile's own value.
# env (not read): M3_SQLITE_MMAP_SIZE
# type: integer; restart to apply
# sqlite_mmap_size = <unset: keeps the pragma profile's own value>  # default (computed)

[db.postgres]

# Schema holding the dispatch queue on PostgreSQL.
# env (not read): M3_DISPATCH_PG_SCHEMA
# type: string; restart to apply
# dispatch_schema = "m3_dispatch"

# Hosts a PRIMARY store must never connect to (e.g. the warehouse); selecting one is
# refused.
# env (not read): M3_PG_FORBIDDEN_HOSTS
# type: list of strings; restart to apply
# forbidden_hosts = []

# pg_dump used for snapshots; unset finds it on PATH. pg_restore is looked for beside
# it.
# env (not read): M3_PG_DUMP
# type: path
# pg_dump = <unset: finds it on PATH>  # default (computed)

# pg_restore used to verify snapshots; unset: beside pg_dump, else on PATH.
# env (not read): M3_PG_RESTORE
# type: path
# pg_restore = <unset: beside pg_dump, else on PATH>  # default (computed)

# Maximum connections in the PostgreSQL pool (at least pool_min).
# env (not read): M3_PG_POOL_MAX
# type: integer; restart to apply
# pool_max = 16

# Minimum connections in the PostgreSQL pool.
# env (not read): M3_PG_POOL_MIN
# type: integer; restart to apply
# pool_min = 1

# Rows per bulk upsert page; lower it over a slow link (a deliberate tuning knob).
# env (not read): M3_PG_UPSERT_PAGE_SIZE
# type: integer
# upsert_page_size = 500

[dispatch]

# Dispatch queue store: separate (its own) or integrated (the main store). (Today an
# unknown value acts as separate; it is now an error.)
# env (not read): M3_DISPATCH_MODE
# type: string; one of separate, integrated; restart to apply
# mode = "separate"

[embed]

# Search the disk for a bge-m3 GGUF when embed.gguf is unset.
# env (not read): M3_EMBED_GGUF_AUTODETECT
# type: boolean; restart to apply
# autodetect = true

# Seconds the GGUF discovery walk may take.
# env (not read): M3_EMBED_GGUF_WALK_BUDGET
# type: number; restart to apply
# autodetect_budget_s = 2.0

# Texts per bulk embedding request.
# env (not read): M3_EMBED_BULK_CHUNK, EMBED_BULK_CHUNK
# type: integer; restart to apply
# bulk_chunk = 1024

# Concurrent bulk embedding requests.
# env (not read): M3_EMBED_BULK_CONCURRENCY, EMBED_BULK_CONCURRENCY
# type: integer; restart to apply
# bulk_concurrency = 4

# Characters per chunk.
# env (not read): M3_EMBED_CHUNK_MAX_CHARS
# type: integer; restart to apply
# chunk_max_chars = 28000

# Character overlap between chunks.
# env (not read): M3_EMBED_CHUNK_OVERLAP_CHARS
# type: integer; restart to apply
# chunk_overlap_chars = 8000

# In-process embedder: milliseconds the dispatcher waits to coalesce requests into one
# batch.
# env (not read): M3_EMBED_COALESCE_MS
# type: integer; restart to apply
# coalesce_ms = 3

# Other model tags whose vectors share this space.
# env (not read): M3_EMBED_COMPATIBLE_MODELS
# type: list of strings; restart to apply
# compatible_models = []

# Context length in tokens (also read by the Rust core, as a u32).
# env (not read): M3_EMBED_CTX
# type: integer; restart to apply
# ctx = 8192

# Embedding dimension.
# env (not read): M3_EMBED_DIM, EMBED_DIM
# type: integer; restart to apply
# dim = 1024

# Seconds an endpoint that failed discovery is skipped.
# env (not read): M3_EMBED_DISCOVERY_NEG_TTL
# type: number; restart to apply
# discovery_negative_ttl_s = 60.0

# Entity-name embeddings kept in memory.
# env (not read): M3_ENTITY_NAME_EMBED_CACHE_MAX, ENTITY_NAME_EMBED_CACHE_MAX
# type: integer; restart to apply
# entity_name_cache_max = 50000

# CA certificate (PEM) that verifies an https embed.fallback_url whose certificate is
# not publicly trusted, e.g. a private CA. A `tailscale cert` certificate needs none.
# type: path; restart to apply
# fallback_ca = <unset>  # default (computed)

# Tag of vectors from the fallback endpoint. Default: embed.model.
# env (not read): M3_EMBED_FALLBACK_MODEL_TAG
# type: string; restart to apply
# fallback_model_tag = <embed.model>  # default (computed)

# The fallback embedding endpoint (the shared embed server).
# env (not read): M3_EMBED_FALLBACK_URL
# type: string; restart to apply
# fallback_url = "http://127.0.0.1:8082"

# The GGUF weights file. Unset: m3's models root, the bundled asset, then discovery
# (embed.autodetect). Not an env override.
# env (not read): M3_EMBED_GGUF
# type: path; restart to apply
# gguf = <unset: m3's models root, the bundled asset, then discovery (embed.autodetect)>  # default (computed)

# Tag of vectors from the in-process GGUF embedder. Default: embed.space_tag.
# env (not read): M3_EMBED_GGUF_MODEL_TAG
# type: string; restart to apply
# gguf_model_tag = <embed.space_tag>  # default (computed)

# Seconds to wait for the in-process embedder to load; 0 disables the limit.
# env (not read): M3_EMBED_INIT_TIMEOUT_S
# type: number; restart to apply
# init_timeout_s = 20.0

# Allow the in-process tier-1 embedder (opt-in, DESIGN_PHILOSOPHIES §8).
# env (not read): M3_EMBED_INPROC
# type: boolean; restart to apply
# inproc = false

# In-process embedder: the dispatcher's coalescing ceiling in tokens. Unset:
# embed.streams x embed.ctx.
# env (not read): M3_EMBED_MAX_BATCH_TOKENS
# type: integer; restart to apply
# max_batch_tokens = <unset: embed.streams x embed.ctx>  # default (computed)

# The embedding model name requested from the endpoint.
# env (not read): M3_EMBED_MODEL, EMBED_MODEL
# type: string; restart to apply
# model = "text-embedding-bge-m3"

# In-process embedder: llama.cpp batch tokens. Unset: embed.ctx (the only encoder-safe
# value).
# env (not read): M3_EMBED_N_BATCH
# type: integer; restart to apply
# n_batch = <unset: embed.ctx (the only encoder-safe value)>  # default (computed)

# In-process embedder: llama.cpp micro-batch tokens. Unset: embed.ctx (the only
# encoder-safe value).
# env (not read): M3_EMBED_N_UBATCH
# type: integer; restart to apply
# n_ubatch = <unset: embed.ctx (the only encoder-safe value)>  # default (computed)

# Allowed deviation from unit norm.
# env (not read): M3_EMBED_NORM_TOL
# type: number; restart to apply
# norm_tolerance = 0.05

# Reject vectors whose norm is not 1 within embed.norm_tolerance.
# env (not read): M3_EMBED_REQUIRE_UNIT_NORM
# type: boolean; restart to apply
# require_unit_norm = true

# Seconds a search waits for its query embedding; 0 disables the limit.
# env (not read): M3_EMBED_SEARCH_DEADLINE_S
# type: number; restart to apply
# search_deadline_s = 8.0

# In-process embedder: sequences packed into one decode call.
# env (not read): M3_EMBED_SEQ_MAX
# type: integer; restart to apply
# seq_max = 32

# The vector space rows are tagged with; decides search compatibility. Default:
# embed.model.
# env (not read): M3_EMBED_SPACE_TAG
# type: string; restart to apply
# space_tag = <embed.model>  # default (computed)

# In-process embedder: worker contexts (each holds a ~4 GiB compute graph at ctx 8192).
# env (not read): M3_EMBED_STREAMS
# type: integer; restart to apply
# streams = 8

# Tokens per chunk.
# env (not read): M3_EMBED_TOKEN_BUDGET
# type: integer; restart to apply
# token_budget = 7000

# Token overlap between chunks.
# env (not read): M3_EMBED_TOKEN_OVERLAP
# type: integer; restart to apply
# token_overlap = 2000

# Embedding endpoint override; unset uses the configured endpoints.
# env (not read): M3_EMBED_URL
# type: string; restart to apply
# url = <unset: uses the configured endpoints>  # default (computed)

[embed.breaker]

# Seconds the cloud tier's breaker stays open.
# env (not read): M3_EMBED_BREAKER_CLOUD_RESET_SECS
# type: number; restart to apply
# cloud_reset_s = 60.0

# Consecutive failures that open the cloud tier's breaker.
# env (not read): M3_EMBED_BREAKER_CLOUD_THRESHOLD
# type: integer; restart to apply
# cloud_threshold = 3

# Seconds the cpu_fallback tier's breaker stays open.
# env (not read): M3_EMBED_BREAKER_CPU_FALLBACK_RESET_SECS
# type: number; restart to apply
# cpu_fallback_reset_s = 30.0

# Consecutive failures that open the cpu_fallback tier's breaker.
# env (not read): M3_EMBED_BREAKER_CPU_FALLBACK_THRESHOLD
# type: integer; restart to apply
# cpu_fallback_threshold = 3

# Seconds the embedded tier's breaker stays open.
# env (not read): M3_EMBED_BREAKER_EMBEDDED_RESET_SECS
# type: number; restart to apply
# embedded_reset_s = 30.0

# Consecutive failures that open the embedded tier's breaker.
# env (not read): M3_EMBED_BREAKER_EMBEDDED_THRESHOLD
# type: integer; restart to apply
# embedded_threshold = 5

# Seconds the primary tier's breaker stays open.
# env (not read): M3_EMBED_BREAKER_PRIMARY_RESET_SECS
# type: number; restart to apply
# primary_reset_s = 60.0

# Consecutive failures that open the primary tier's breaker.
# env (not read): M3_EMBED_BREAKER_PRIMARY_THRESHOLD
# type: integer; restart to apply
# primary_threshold = 3

[embed.gpu]

# Address the GPU embed proxy binds.
# env (not read): M3_EMBED_SERVER_GPU_HOST, EMBED_SERVER_GPU_HOST
# type: string; restart to apply
# host = "127.0.0.1"

# llama-server's port.
# env (not read): M3_LLAMA_PORT, LLAMA_PORT
# type: integer; restart to apply
# llama_port = 9904

# llama-server executable. Unset: ~/llama.cpp/bin/llama-server.exe.
# env (not read): M3_LLAMA_SERVER_EXE, LLAMA_SERVER_EXE
# type: path; restart to apply
# llama_server_exe = <unset: ~/llama.cpp/bin/llama-server.exe>  # default (computed)

# GGUF file llama-server loads. Unset: models/qwen3-q8.gguf under the CURRENT directory
# (a working-directory-dependent default; 2D fixes it).
# env (not read): M3_GGUF_MODEL_PATH, GGUF_MODEL_PATH
# type: path; restart to apply
# model_path = <unset: models/qwen3-q8.gguf under the CURRENT directory>  # default (computed)

[embed.http]

# Seconds an idle kept-alive connection lives.
# env (not read): M3_EMBED_HTTP_KEEPALIVE_EXPIRY
# type: number; restart to apply
# keepalive_expiry_s = 5.0

# HTTP connection pool size.
# env (not read): M3_EMBED_HTTP_MAX_CONNS
# type: integer; restart to apply
# max_connections = 32

# Kept-alive HTTP connections.
# env (not read): M3_EMBED_HTTP_MAX_KEEPALIVE
# type: integer; restart to apply
# max_keepalive = 16

[embed.server]

# The m3-embed-server binary; unset uses the wheel's, then PATH.
# env (not read): M3_EMBED_SERVER_BIN
# type: path; restart to apply
# bin = <unset: uses the wheel's, then PATH>  # default (computed)

# m3-embed-server: milliseconds the dispatcher waits to coalesce requests into one
# batch.
# type: integer; restart to apply
# coalesce_ms = 3

# Concurrent requests; 0 uses the backend's stream pool.
# env (not read): M3_EMBED_SERVER_CONCURRENCY
# type: integer; restart to apply
# concurrency = 0

# Address the shared embed server binds (also read by the Rust server).
# env (not read): M3_EMBED_SERVER_HOST, EMBED_SERVER_HOST
# type: string; restart to apply
# host = "127.0.0.1"

# Largest request still treated as interactive.
# env (not read): M3_EMBED_INTERACTIVE_MAX_TEXTS
# type: integer; restart to apply
# interactive_max_texts = 8

# Slots reserved for interactive (search) requests.
# env (not read): M3_EMBED_SERVER_INTERACTIVE_RESERVED
# type: integer; restart to apply
# interactive_reserved = 1

# Texts per server batch.
# env (not read): M3_EMBED_SERVER_MAX_BATCH
# type: integer; restart to apply
# max_batch = 2048

# m3-embed-server: the dispatcher's coalescing ceiling in tokens.
# type: integer; restart to apply
# max_batch_tokens = 2048

# m3-embed-server: llama.cpp batch tokens. Unset: embed.ctx (the only encoder-safe
# value); a value below embed.ctx is raised to it.
# type: integer; restart to apply
# n_batch = <unset: embed.ctx (the only encoder-safe value)>  # default (computed)

# m3-embed-server: llama.cpp micro-batch tokens. Unset: embed.ctx (the only encoder-safe
# value); a value below embed.ctx is raised to it.
# type: integer; restart to apply
# n_ubatch = <unset: embed.ctx (the only encoder-safe value)>  # default (computed)

# Port of the shared embed server (also read by the Rust server, as a u16).
# env (not read): M3_EMBED_SERVER_PORT
# type: integer; restart to apply
# port = 8082

# m3-embed-server: address (ip or ip:port) of the TLS listener for other machines; unset
# = loopback only. Set by `m3 embedder secure`; needs tls_cert, tls_key and the
# M3_EMBED_SERVER_TOKEN_SHA256 secret.
# type: string; restart to apply
# remote_listen = <unset: loopback only>  # default (computed)

# m3-embed-server: sequences packed into one decode call.
# type: integer; restart to apply
# seq_max = 32

# m3-embed-server: worker contexts. Unset: 2 on a GPU build (cuda/vulkan/metal), 1 on a
# CPU-only build; each holds a ~4 GiB compute graph at ctx 8192.
# type: integer; restart to apply
# streams = <unset: 2 on a GPU build (cuda/vulkan/metal), 1 on a CPU-only build>  # default (computed)

# m3-embed-server: TLS certificate chain (PEM) for embed.server.remote_listen.
# type: path; restart to apply
# tls_cert = <unset>  # default (computed)

# m3-embed-server: private key (PEM) of embed.server.tls_cert; must be readable only by
# its owner.
# type: path; restart to apply
# tls_key = <unset>  # default (computed)

[enrich]

# Spending cap for one run, in US dollars; unset is uncapped.
# env (not read): M3_ENRICH_BUDGET_USD
# type: number; restart to apply
# budget_usd = <unset: uncapped>  # default (computed)

# File listing the conversations to enrich.
# env (not read): M3_ENRICH_CONV_LIST
# type: path; restart to apply
# conv_list = <unset>  # default (computed)

# Input cap in KiB; unset uses the profile's own.
# env (not read): M3_ENRICH_INPUT_MAX_K
# type: integer; restart to apply
# input_max_k = <unset: uses the profile's own>  # default (computed)

# Attempts before a conversation is dead-lettered.
# env (not read): M3_ENRICH_MAX_ATTEMPTS
# type: integer; restart to apply
# max_attempts = 3

# --resume: skip conversations larger than this (KiB).
# env (not read): M3_ENRICH_MAX_SIZE_K
# type: integer; restart to apply
# max_size_k = <unset>  # default (computed)

# --resume: skip conversations smaller than this (KiB).
# env (not read): M3_ENRICH_MIN_SIZE_K
# type: integer; restart to apply
# min_size_k = <unset>  # default (computed)

# SLM profile (under config/slm/) m3_enrich uses.
# env (not read): M3_ENRICH_PROFILE
# type: string; restart to apply
# profile = "enrich_local_qwen"

# --resume: only conversations assigned to this provider.
# env (not read): M3_ENRICH_SEND_TO
# type: string; restart to apply
# send_to = <unset>  # default (computed)

# Record per-conversation enrichment state (forced on by --resume and budgets).
# env (not read): M3_ENRICH_TRACK_STATE
# type: boolean; restart to apply
# track_state = false

[entity]

# File listing the conversations to extract entities from.
# env (not read): M3_ENTITIES_CONV_LIST
# type: path; restart to apply
# conv_list = <unset>  # default (computed)

# Concurrent entity extractions.
# env (not read): M3_ENTITY_EXTRACT_CONCURRENCY
