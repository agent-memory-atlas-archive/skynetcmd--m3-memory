# Trivy SECRET-scanner configuration for m3-memory.
#
# Required for the same reason as trivy.yaml: the scanner passes
# --secret-config <repo>/trivy-secret.yaml unconditionally, and a missing file
# is a FATAL that produces no report at all.
#
# Deliberately adds NO suppressions. The repo's known false-positive class is
# trufflehog's `Lob` detector matching Python TEST FUNCTION NAMES, which is
# filtered at the gate, not here. Nothing has yet justified disabling a trivy
# secret rule, and a suppression added "just in case" is how a real finding
# gets hidden later.
#
# `disable-rules` is a LIST of rule IDs. An empty list keeps every builtin rule
# active while giving the YAML a key to parse. (`enable-builtin-rules: true` was
# the first attempt and is a type error — that field is also a list of rule IDs,
# and trivy rejects the file with a `secrets config decode error`, which lands
# as the same no-artifact FATAL this file exists to prevent.)
disable-rules: []
